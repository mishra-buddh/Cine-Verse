<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Changer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: white;
            color: black;
        }
        button {
            padding: 10px 18px;
            cursor: pointer;
        }
        .dark {
            background-color: #222;
            color: white;
        }
        .light {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body class="light">
    <h2>Change Color Theme</h2>
    <p>Click the button to switch between light and dark mode.</p>
    <button onclick="changeTheme()">Change Theme</button>

    <script>
        function changeTheme() {
            let page = document.body;

            if (page.className === "light") {
                page.className = "dark";
            }
            else {
                page.className = "light";
            }
        }
    </script>
</body>
</html>
